<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Portfolio responsive preview</title
  ><style>
    body {
      margin: 0;
      background: #cbd4d0;
      font: 14px Arial;
    }
    header {
      padding: 15px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    button {
      padding: 9px 15px;
    }
    #stage {
      margin: auto;
      width: max-content;
      max-width: 100%;
    }
    iframe {
      border: 0;
      display: block;
      transform-origin: top left;
      height: 1050px;
    }
  </style>
  <header>
    <span>Responsive review</span><button data-width="320">320</button
    ><button data-width="390">390</button><button data-width="768">768</button
    ><button data-width="1440">1440</button><button id="theme">Toggle appearance</button
    ><button id="top">Hero</button><button id="work">Projects</button
    ><button id="about">About</button><button id="credentials">Credentials</button
    ><button id="contact">Contact</button>
  </header>
  <div id="stage"><iframe title="Portfolio responsive preview" id="site" src="/"></iframe></div>
  <script>
    const f = document.getElementById("site");
    let width = 390;
    function resize() {
      f.width = width;
      const scale = Math.min(1, (innerWidth - 30) / width);
      f.style.transform = `scale(${scale})`;
      document.getElementById("stage").style.width = width * scale + "px";
    }
    document.querySelectorAll("[data-width]").forEach(
      (b) =>
        (b.onclick = () => {
          width = Number(b.dataset.width);
          resize();
        }),
    );
    document.getElementById("theme").onclick = () =>
      f.contentDocument.getElementById("theme").click();
    for (const [button, target] of Object.entries({
      top: "home",
      work: "work",
      about: "about",
      credentials: "certifications",
      contact: "contact",
    }))
      document.getElementById(button).onclick = () =>
        f.contentDocument.getElementById(target).scrollIntoView({ behavior: "instant" });
    onresize = resize;
    resize();
  </script>
</html>
