<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Portfolio interaction checks</title>
    <style>
      body {
        margin: 25px;
        font: 15px/1.5 system-ui;
        color: #eee;
        background: #111;
      }
      button {
        padding: 12px 20px;
      }
      pre {
        white-space: pre-wrap;
      }
      iframe {
        display: block;
        border: 0;
        height: 900px;
        max-width: none;
      }
      #preview {
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>Portfolio interaction checks</h1>
    <p>
      Local checks. All contact submissions are intercepted; no real messages
      are sent.
    </p>
    <button id="run">Run checks</button>
    <pre id="results">Ready</pre>
    <div id="preview"></div>
    <script type="module">
      const results = document.getElementById("results");
      const area = document.getElementById("preview");
      const pause = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      let total = 0,
        failures = 0;
      function check(value, label) {
        total++;
        if (!value) failures++;
        results.textContent += `${value ? "PASS" : "FAIL"} ${label}\n`;
      }
      async function until(fn, timeout = 6000) {
        const deadline = Date.now() + timeout;
        while (!fn() && Date.now() < deadline) await pause(35);
        if (!fn()) throw new Error("Timed out waiting for interface state");
      }
      async function frame(
        width = 1440,
        mode = "normal",
        page = "/index.html",
      ) {
        area.replaceChildren();
        const f = document.createElement("iframe");
        f.width = width;
        f.title = "Portfolio under test";
        let html = await (await fetch(page)).text();
        const setup = `<base href="${location.origin}/"><script>
          window.__mode=${JSON.stringify(mode)};window.__calls=0;
          const nativeFetch=window.fetch.bind(window),nativeMedia=window.matchMedia.bind(window);
          if(__mode==='reduced')window.matchMedia=q=>q==='(prefers-reduced-motion: reduce)'?{matches:true,addEventListener(){},removeEventListener(){}}:nativeMedia(q);
          if(__mode==='saveData')Object.defineProperty(navigator,'connection',{value:{saveData:true,addEventListener(){},removeEventListener(){}}});
          window.fetch=async(url,options)=>{
            if(options?.method==='POST'){
              __calls++;await new Promise(r=>setTimeout(r,80));
              if(__mode==='network')throw Error('network');
              if(__mode==='timeout')throw new DOMException('Timeout','TimeoutError');
              if(__mode==='malformed')return new Response('not json');
              return new Response(JSON.stringify({success:__mode==='accept'}),{status:__mode==='http'?500:200,headers:{'Content-Type':'application/json'}});
            }
            const path=new URL(url,location.href).pathname;
            if(path==='/api/github')return new Response('{}',{status:503});
            if(__mode==='activityUnavailable'&&path==='/data/github-contributions.json')return new Response('{}',{status:503});
            return nativeFetch(url,options);
          };
        <\/script>`;
        html = html.replace("<head>", "<head>" + setup);
        f.srcdoc = html;
        area.append(f);
        await new Promise((resolve) => (f.onload = resolve));
        await f.contentDocument.fonts.ready;
        await until(() =>
          page === "/contact.html"
            ? Boolean(f.contentDocument.querySelector("form"))
            : f.contentDocument.querySelectorAll(".project-row").length === 5 &&
              f.contentDocument.querySelectorAll(".certificate-item").length ===
                5 &&
              f.contentDocument.documentElement.dataset.wordMotion === "ready",
        );
        await pause(100);
        return f;
      }
      async function run() {
        total = failures = 0;
        results.textContent = "";
        document.getElementById("run").disabled = true;
        try {
          for (const width of [320, 390, 768, 1032, 1440]) {
            const f = await frame(width);
            const d = f.contentDocument,
              w = f.contentWindow;
            check(
              d.documentElement.scrollWidth <= w.innerWidth,
              `No horizontal overflow at ${width}`,
            );
            check(
              d.querySelector("h1").getAttribute("aria-label") ===
                "Brad Josh Nebreja",
              `Owner name at ${width}`,
            );
            check(
              [
                "home",
                "about",
                "services",
                "work",
                "experience",
                "workflow",
                "stack",
                "github",
                "certifications",
                "contact",
              ].every((id) => d.getElementById(id)),
              `All requested sections at ${width}`,
            );
            check(
              !d.querySelector("#education"),
              `Education remains removed at ${width}`,
            );
            check(
              d.querySelectorAll("#about strong").length === 9,
              `Nine About highlights at ${width}`,
            );
            check(
              d.querySelectorAll(".project-row").length === 5,
              `Five Selected Works at ${width}`,
            );
            check(
              d.querySelectorAll(".stack-groups:not(.stack-replica) .tech-chip")
                .length === 34,
              `34 tools; full library linked at ${width}`,
            );
            check(
              d.querySelectorAll(".experience details").length === 5,
              `Five experiences retained at ${width}`,
            );
            if (width <= 1100) {
              const row = d.querySelector(".experience details");
              row.querySelector("summary").click();
              check(
                w.getComputedStyle(row.querySelector(".experience-description"))
                  .display === "none" &&
                  w.getComputedStyle(row.querySelector(".title")).visibility ===
                    "hidden",
                `Compact Experience replaces its label without duplicate text at ${width}`,
              );
              check(
                w.getComputedStyle(d.querySelector(".experience-object"))
                  .display === "none",
                `Compact Experience hides decorative keyboard at ${width}`,
              );
              row.open = false;
            }
            check(
              d.querySelectorAll(".workflow-item").length === 3,
              `AI, Code and Workflow at ${width}`,
            );
            check(
              d.querySelectorAll('a[href$="CV-2026-v6.pdf"]').length >= 1,
              `Current CV links at ${width}`,
            );
            check(
              d.querySelectorAll(".hero-socials a").length === 4 &&
                d.querySelectorAll(".menu-profile-links a").length === 4,
              `Owner social icons at ${width}`,
            );
            check(
              w
                .getComputedStyle(d.documentElement)
                .getPropertyValue("--accent")
                .trim() === "#b87945",
              `Caramel palette at ${width}`,
            );
            d.getElementById("menuToggle").click();
            await pause(900);
            check(
              d.getElementById("mobileMenu").open &&
                d.body.classList.contains("modal-open"),
              `Menu opens and locks scroll at ${width}`,
            );
            check(d.activeElement.id === "closeMenu", `Menu focus at ${width}`);
            check(
              d.querySelectorAll("#mobileMenu nav a").length === 8,
              `All navigation destinations at ${width}`,
            );
            d.getElementById("closeMenu").click();
            await until(
              () =>
                !d.getElementById("mobileMenu").open &&
                !d.body.classList.contains("modal-open") &&
                d.activeElement === d.getElementById("menuToggle"),
            );
            check(
              !d.getElementById("mobileMenu").open &&
                !d.body.classList.contains("modal-open"),
              `Menu closes and unlocks at ${width}`,
            );
            check(
              d.activeElement.id === "menuToggle",
              `Menu restores focus at ${width}`,
            );
            const first = d.querySelector(".experience details"),
              second = d.querySelectorAll(".experience details")[1];
            first.querySelector("summary").click();
            second.querySelector("summary").click();
            await pause(50);
            check(
              !first.open && second.open,
              `Exclusive experience accordion at ${width}`,
            );
            const next = d.querySelector('[aria-label="Next certificate"]');
            next.click();
            check(
              d.querySelectorAll(".certificate-item.is-current").length === 1 &&
                d
                  .querySelectorAll(".certificate-item")[1]
                  .classList.contains("is-current"),
              `Carousel advances at ${width}`,
            );
            d.querySelector('[aria-label="Previous certificate"]').click();
            check(
              d
                .querySelector(".certificate-item")
                .classList.contains("is-current"),
              `Carousel reverses at ${width}`,
            );
            d.querySelector('[aria-label="Previous certificate"]').click();
            check(
              d
                .querySelectorAll(".certificate-item")[4]
                .classList.contains("is-current"),
              `Carousel wraps at ${width}`,
            );
            check(
              [...d.querySelectorAll(".certificate-item")].filter(
                (e) => !e.inert,
              ).length === 1,
              `Only current certificate is interactive at ${width}`,
            );
            const stage = d.querySelector(".certificate-stage");
            stage.dispatchEvent(
              new w.KeyboardEvent("keydown", { key: "Home", bubbles: true }),
            );
            check(
              d
                .querySelector(".certificate-item")
                .classList.contains("is-current"),
              `Carousel Home key at ${width}`,
            );
            d.querySelector(".certificate-item").click();
            await pause(100);
            check(
              d.getElementById("imageDialog").open,
              `Certificate viewer opens at ${width}`,
            );
            check(
              d.activeElement.id === "closeImage",
              `Certificate viewer focuses close at ${width}`,
            );
            d.getElementById("closeImage").click();
            await until(() => !d.body.classList.contains("modal-open"));
            check(
              !d.body.classList.contains("modal-open"),
              `Certificate viewer restores page at ${width}`,
            );
            for (const id of [
              "cpc",
              "checkpoint",
              "cinemabuddy",
              "portfolio",
              "praisepoint",
            ]) {
              const link = d.querySelector(
                `.project-main[href$="project=${id}"]`,
              );
              check(
                Boolean(link),
                `${id} dedicated case-study link at ${width}`,
              );
            }
            check(
              d.querySelector(".view-all").getAttribute("href") ===
                "stack.html",
              `Tech Stack View All at ${width}`,
            );
            check(
              d
                .querySelector("#contact .reference-pill")
                .getAttribute("href") === "contact.html",
              `Dedicated Contact link at ${width}`,
            );
            await until(
              () =>
                d.querySelector("portfolio-contributions").dataset
                  .activityState === "snapshot",
            );
            check(
              d.querySelectorAll(".contribution-day").length >= 300,
              `Verified activity fallback at ${width}`,
            );
            const words = d.querySelectorAll("#about .word");
            w.scrollTo({ top: 0, behavior: "instant" });
            await pause(80);
            const before = words[0].style.getPropertyValue("--word-fill");
            w.scrollTo({
              top: d.getElementById("about").offsetTop + 200,
              behavior: "instant",
            });
            await pause(100);
            const after = words[0].style.getPropertyValue("--word-fill");
            check(
              parseFloat(after) > parseFloat(before),
              `About words fill with scrolling at ${width}`,
            );
            w.scrollTo({ top: 0, behavior: "instant" });
            await pause(100);
            check(
              parseFloat(words[0].style.getPropertyValue("--word-fill")) <=
                parseFloat(after),
              `About fill reverses at ${width}`,
            );
          }
          for (const mode of ["reduced", "saveData"]) {
            const f = await frame(390, mode),
              d = f.contentDocument,
              w = f.contentWindow;
            check(
              d.documentElement.hasAttribute("data-motion-static"),
              `${mode} disables motion`,
            );
            check(
              [...d.querySelectorAll("#about .word")].every(
                (e) => w.getComputedStyle(e).opacity === "1",
              ),
              `${mode} words remain readable`,
            );
          }
          let f = await frame(390, "activityUnavailable"),
            d = f.contentDocument;
          await until(
            () =>
              d.querySelector("portfolio-contributions").dataset
                .activityState === "unavailable",
          );
          check(
            d.querySelector(".contribution-error button") &&
              d.querySelector(".contribution-error a").href ===
                "https://github.com/Josh-L30",
            "Activity outage has retry and real profile link",
          );
          for (const mode of [
            "reject",
            "http",
            "malformed",
            "network",
            "timeout",
            "accept",
          ]) {
            f = await frame(390, mode, "/contact.html");
            d = f.contentDocument;
            const form = d.querySelector("form");
            form.elements.name.value = "Local test";
            form.elements.email.value = "test@example.com";
            form.elements.message.value = "Intercepted regression check";
            form.requestSubmit();
            form.requestSubmit();
            await pause(160);
            check(
              f.contentWindow.__calls === 1,
              `One intercepted request: ${mode}`,
            );
            check(
              !form.querySelector("button[type=submit]").disabled,
              `Contact unlocks: ${mode}`,
            );
            check(
              mode === "accept"
                ? form.elements.message.value === ""
                : form.elements.message.value ===
                    "Intercepted regression check",
              `Contact preserves/resets message: ${mode}`,
            );
            check(
              form.querySelector("button").dataset.state ===
                (mode === "accept" ? "success" : "error"),
              `Contact status: ${mode}`,
            );
          }
        } catch (error) {
          check(false, error.stack);
        } finally {
          results.textContent += `\n${total - failures}/${total} passed`;
          document.documentElement.dataset.testResult = failures
            ? "fail"
            : "pass";
          document.getElementById("run").disabled = false;
        }
      }
      document.getElementById("run").addEventListener("click", run);
    </script>
  </body>
</html>
