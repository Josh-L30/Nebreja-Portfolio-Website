<!DOCTYPE html><html lang="en"><meta charset="utf-8"><title>Portfolio regression checks</title><style>body{font:16px Arial;background:#f5f7f6;color:#162c23;margin:24px}button{padding:14px}iframe{border:0;height:900px;display:block;margin-top:20px;max-width:none}pre{white-space:pre-wrap} .pass{color:#145d38}.fail{color:#a52828}</style><h1>Portfolio regression checks</h1><p>Local checks only. Contact requests are intercepted and never sent.</p><button id="run">Run checks</button><pre id="results">Ready</pre><div id="preview"></div><script type="module">
const results=document.getElementById('results'),area=document.getElementById('preview');let count=0,failures=0;
function check(ok,label){count++;if(!ok)failures++;results.textContent+=(ok?'PASS ':'FAIL ')+label+'\n'}
const pause=ms=>new Promise(r=>setTimeout(r,ms));
async function frame(width=1440,mode='normal',theme=null){area.replaceChildren();const f=document.createElement('iframe');f.width=width;f.title='Portfolio under test';let html=await(await fetch('/index.html')).text();const setup=`<base href="${location.origin}/"><script>window.__calls=0;window.__mode=${JSON.stringify(mode)};const nativeFetch=window.fetch.bind(window);window.__reduced=false;const nativeMedia=window.matchMedia.bind(window);const listeners=new Set();const reduceQuery={get matches(){return window.__reduced},addEventListener(t,fn){listeners.add(fn)},removeEventListener(t,fn){listeners.delete(fn)}};window.matchMedia=q=>q==='(prefers-reduced-motion: reduce)'?reduceQuery:nativeMedia(q);window.__setReduced=value=>{window.__reduced=value;listeners.forEach(fn=>fn({matches:value}))};if(window.__mode==='reduced')window.__reduced=true;if(window.__mode==='saveData')Object.defineProperty(navigator,'connection',{value:{saveData:true,addEventListener(){},removeEventListener(){}}});window.fetch=async(url,options)=>{if(options?.method==='POST'){window.__calls++;await new Promise(r=>setTimeout(r,30));if(window.__mode==='network')throw Error('network');if(window.__mode==='timeout')throw new DOMException('Timeout','TimeoutError');if(window.__mode==='malformed')return new Response('bad');return new Response(JSON.stringify({success:window.__mode==='accept'}),{status:window.__mode==='http'?500:200,headers:{'Content-Type':'application/json'}})}return nativeFetch(url,options)};${theme?`localStorage.setItem('brad-theme',${JSON.stringify(theme)});`:"localStorage.removeItem('brad-theme');"}<\/script>`;html=html.replace('<head>','<head>'+setup);f.srcdoc=html;area.append(f);await new Promise(r=>f.onload=r);await pause(750);return f}
async function run(){results.textContent='';count=failures=0;document.getElementById('run').disabled=true;try{
let f=await frame(),d=f.contentDocument,w=f.contentWindow;
check(!d.body.classList.contains('light'),'Default appearance is dark');
check(d.querySelectorAll('.project-showcase').length===3,'Three visible project families');
check(new Set([...d.querySelectorAll('[data-project]')].map(x=>x.dataset.project)).size===5,'Five work entries have launch controls');
check(d.querySelector('[data-signature-visual]')!==null,'Featured project has signature visual');
for(const id of ['cpc','dashboard','gamemechanics','cinemabuddy','cinemabuddyux']){const launch=d.querySelector(`[data-project="${id}"]`);if(!launch){check(false,'Open '+id);continue}launch.focus();launch.click();await pause(150);check(d.getElementById('projectDialog').open,'Open '+id+' in-page');d.getElementById('closeDialog').click();await pause(100);check(d.activeElement===launch,'Restore '+id+' launch focus')}
const launch=d.querySelector('[data-project="cpc"]');if(launch){w.scrollTo(0,600);await pause(100);const y=w.scrollY;launch.focus({preventScroll:true});launch.click();await pause(100);d.getElementById('galleryNext').click();d.getElementById('enlargePreview').click();await pause(100);check(d.getElementById('imageDialog').open,'Nested full-image view opens');d.getElementById('closeImage').click();check(d.getElementById('projectDialog').open,'Project remains open after image close');check(d.getElementById('galleryCount').textContent.startsWith('2 '),'Selected gallery image is retained');d.getElementById('closeDialog').click();await pause(100);check(Math.abs(w.scrollY-y)<3,'Page position restored')}
for(const width of [320,390,768,1440]){f.width=width;await pause(100);check(d.documentElement.scrollWidth<=d.documentElement.clientWidth,'No horizontal overflow at '+width)}
f.width=390;d.getElementById('mobileMenu').click();check(d.getElementById('mobileMenu').getAttribute('aria-expanded')==='true','Mobile menu opens');d.querySelector('#sectionNav a').click();check(d.getElementById('mobileMenu').getAttribute('aria-expanded')==='false','Anchor dismisses menu');
f=await frame(390,'normal','light');d=f.contentDocument;check(d.body.classList.contains('light'),'Stored light preference restored');d.getElementById('theme').click();await pause(80);check(!d.body.classList.contains('light'),'Theme control switches appearance');

for(const theme of ['dark','light']){f=await frame(1440,'normal',theme);d=f.contentDocument;for(const width of [320,390,768,1440]){f.width=width;await pause(80);check(d.documentElement.scrollWidth<=d.documentElement.clientWidth,theme+' layout fits '+width)}const styles=f.contentWindow.getComputedStyle(d.body);function luminance(color){const rgb=color.match(/[\d.]+/g).slice(0,3).map(Number).map(v=>{v/=255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4});return .2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2]}function ratio(a,b){const x=luminance(a),y=luminance(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}check(ratio(styles.color,styles.backgroundColor)>=4.5,theme+' body text contrast');const soft=d.querySelector('.lede'),ss=f.contentWindow.getComputedStyle(soft);check(ratio(ss.color,styles.backgroundColor)>=4.5,theme+' secondary text contrast')}
for(const mode of ['reduced','saveData']){f=await frame(1440,mode);d=f.contentDocument;f.contentWindow.scrollTo({top:d.querySelector('[data-signature-visual]').offsetTop-300,behavior:'instant'});await pause(300);check(!d.querySelector('[data-signature-visual]').style.transform,mode+' removes signature movement');check(d.querySelectorAll('.reveal-enter').length===0,mode+' removes entrance movement');d.querySelector('[data-project="cpc"]').click();await pause(50);check(f.contentWindow.getComputedStyle(d.getElementById('projectDialog')).animationName==='none',mode+' removes dialog entrance animation');d.getElementById('closeDialog').click()}
f=await frame(1440);d=f.contentDocument;f.contentWindow.__setReduced(true);await pause(50);check(!d.querySelector('[data-signature-visual]').style.transform,'Changing motion preference resets signature');check(d.querySelectorAll('.reveal-enter').length===0,'Changing motion preference clears entrances');
const item=d.querySelector('[data-project="cpc"]');item.click();await pause(80);const image=d.getElementById('detailImage');image.srcset='';image.src='/assets/missing-test-image.webp';await pause(150);check(d.getElementById('galleryStatus').textContent.includes('could not load'),'Failed preview has recovery feedback');d.getElementById('closeDialog').click();
const certificateChoices=[...d.querySelectorAll('.certificate-choice')];check(certificateChoices.length===5,'All five certificate choices retained');for(const choice of certificateChoices){choice.click();const link=[...d.querySelectorAll('.certificate-item')].find(x=>!x.hidden);link.focus();link.click();await pause(60);check(d.getElementById('imageDialog').open,'Certificate opens in-page');d.getElementById('closeImage').click();check(d.activeElement===link,'Certificate focus restored')}
f=await frame(320);d=f.contentDocument;const textElements=[...d.querySelectorAll('body *')].filter(el=>[...el.childNodes].some(n=>n.nodeType===3&&n.textContent.trim())&&!['SCRIPT','STYLE'].includes(el.tagName)).map(el=>[el,parseFloat(f.contentWindow.getComputedStyle(el).fontSize)]);textElements.forEach(([el,size])=>el.style.fontSize=size*2+'px');await pause(100);check(d.documentElement.scrollWidth<=d.documentElement.clientWidth,'200 percent text enlargement fits at 320px');
for(const mode of ['reject','http','malformed','network','timeout','accept']){f=await frame(390,mode);d=f.contentDocument;const form=d.querySelector('form');form.elements.name.value='Local test';form.elements.email.value='test@example.com';form.elements.message.value='Intercepted regression check';form.requestSubmit();form.requestSubmit();await pause(180);check(f.contentWindow.__calls===1,'Single intercepted request: '+mode);check(mode==='accept'?form.elements.message.value==='':form.elements.message.value==='Intercepted regression check','Message retention/reset: '+mode);check(!form.querySelector('button[type=submit]').disabled,'Form unlocked: '+mode)}
}catch(e){check(false,e.stack)}finally{results.textContent+=`\n${count-failures}/${count} passed`;document.documentElement.dataset.testResult=failures?'fail':'pass';document.getElementById('run').disabled=false}}
document.getElementById('run').addEventListener('click',run);
</script></html>
