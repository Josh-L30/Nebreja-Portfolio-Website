<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="86" viewBox="0 0 1000 86" role="img"><title>Aspiring Full-Stack Developer; UI/UX Designer; learning AI and building useful websites.</title><rect width="1000" height="86" fill="#0d1117"/><style>.role{opacity:0;clip-path:inset(0 100% 0 0);animation:typing 18s linear infinite}.two{animation-delay:6s}.three{animation-delay:12s}@keyframes typing{0%{opacity:1;clip-path:inset(0 100% 0 0)}18%,28%{opacity:1;clip-path:inset(0 0 0 0)}33%,100%{opacity:0;clip-path:inset(0 0 0 0)}}@media(prefers-reduced-motion:reduce){.role{animation:none}.one{opacity:1;clip-path:none}}</style><g class="role one"><text x="500" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" fill="#c89369">Aspiring Full-Stack Developer</text></g><g class="role two"><text x="500" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" fill="#c89369">UI/UX Designer</text></g><g class="role three"><text x="500" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" fill="#c89369">Learning AI. Building useful websites.</text></g></svg>